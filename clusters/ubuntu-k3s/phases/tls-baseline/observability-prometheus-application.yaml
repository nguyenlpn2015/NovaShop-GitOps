apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novashop-prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: novashop
  annotations:
    # Ahead of the workloads it observes, so a scrape target that appears during
    # a rollout is collected from its first moment rather than after it settles.
    argocd.argoproj.io/sync-wave: "-15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: novashop-platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.20.1
      helm:
        releaseName: novashop-prometheus
        valueFiles:
          - $values/kubernetes/observability/prometheus/helm-values.yaml
    - repoURL: https://github.com/nguyenlpn2015/NovaShop.git
      targetRevision: b9405fe14a0b2e619b791e15cfb3d668366d07eb
      ref: values
    - repoURL: https://github.com/nguyenlpn2015/NovaShop.git
      targetRevision: b9405fe14a0b2e619b791e15cfb3d668366d07eb
      path: kubernetes/observability
      directory:
        recurse: false
        include: namespace.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # The chart does not template a storage request that local-path then binds
    # and reports back. Reconciling it would fight the provisioner forever.
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
  revisionHistoryLimit: 10

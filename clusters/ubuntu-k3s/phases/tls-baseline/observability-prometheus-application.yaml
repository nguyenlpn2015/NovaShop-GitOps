apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novashop-prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: novashop
  annotations:
    # Ahead of the workloads it observes, so a scrape target that appears during
    # a rollout is collected from its first moment rather than after it settles.
    argocd.argoproj.io/sync-wave: "-15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: novashop-platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.20.1
      helm:
        releaseName: novashop-prometheus
        # Two values files: scrape configuration, then alerting. Split so the
        # alert rules are reviewable on their own rather than buried in a file
        # about service discovery. Order matters — Helm merges later files over
        # earlier ones, and alerting-values.yaml is what turns Alertmanager on.
        #
        # scripts/validate-observability.sh renders both in this same order, so
        # what CI checks is what this Application deploys.
        valueFiles:
          - $values/kubernetes/observability/prometheus/helm-values.yaml
          - $values/kubernetes/observability/prometheus/alerting-values.yaml
    - repoURL: https://github.com/nguyenlpn2015/NovaShop.git
      targetRevision: e4c901f3948d2e156e1b21b55b310684932724a0
      ref: values
    - repoURL: https://github.com/nguyenlpn2015/NovaShop.git
      targetRevision: e4c901f3948d2e156e1b21b55b310684932724a0
      path: kubernetes/observability
      directory:
        recurse: false
        include: namespace.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # An entry ignoring /spec/minReadySeconds on the Alertmanager StatefulSet was
    # removed from this list. It had no effect, and claiming otherwise was worse
    # than not having it: the normalizer removes the path from the live state,
    # where it is already absent, so nothing changes and the target keeps the
    # field. Anyone finding this Application OutOfSync would have read the entry
    # and ruled out the actual cause.
    #
    # The fix lives in the chart values instead — the field is set to a non-zero
    # value so it survives a round trip through the API. See the comment on
    # minReadySeconds in kubernetes/observability/prometheus/alerting-values.yaml
    # and the fourth failure mode in
    # docs/observability/runbooks/argo-sync-failed.md.
    #
    # The chart does not template a storage request that local-path then binds
    # and reports back. Reconciling it would fight the provisioner forever.
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
  revisionHistoryLimit: 10

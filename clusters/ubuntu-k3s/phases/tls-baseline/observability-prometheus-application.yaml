apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novashop-prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: novashop
  annotations:
    # Ahead of the workloads it observes, so a scrape target that appears during
    # a rollout is collected from its first moment rather than after it settles.
    argocd.argoproj.io/sync-wave: "-15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: novashop-platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.20.1
      helm:
        releaseName: novashop-prometheus
        # Two values files: scrape configuration, then alerting. Split so the
        # alert rules are reviewable on their own rather than buried in a file
        # about service discovery. Order matters — Helm merges later files over
        # earlier ones, and alerting-values.yaml is what turns Alertmanager on.
        #
        # scripts/validate-observability.sh renders both in this same order, so
        # what CI checks is what this Application deploys.
        valueFiles:
          - $values/kubernetes/observability/prometheus/helm-values.yaml
          - $values/kubernetes/observability/prometheus/alerting-values.yaml
    - repoURL: https://github.com/nguyenlpn2015/NovaShop.git
      targetRevision: 43eba6656d037ef84a369f2c8be3dfa8e4a48979
      ref: values
    - repoURL: https://github.com/nguyenlpn2015/NovaShop.git
      targetRevision: 43eba6656d037ef84a369f2c8be3dfa8e4a48979
      path: kubernetes/observability
      directory:
        recurse: false
        include: namespace.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # The chart does not template a storage request that local-path then binds
    # and reports back. Reconciling it would fight the provisioner forever.
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
    # Kubernetes fills in apiVersion and kind on a StatefulSet's
    # volumeClaimTemplate. This Application syncs with ServerSideApply, so Argo CD
    # compares a server-side apply dry-run against the live object, and the
    # dry-run does not produce those two fields. The result is a live object with
    # two fields the prediction lacks, and permanent OutOfSync: the sync reports
    # Succeeded, self-heal reapplies, and the difference survives.
    #
    # Loki is the control that proves the cause. Its StatefulSet has the same two
    # fields in the live object and stays Synced, because the Loki chart templates
    # apiVersion and kind in its volumeClaimTemplate explicitly. The prometheus
    # chart does not, and exposes no value to add them.
    #
    # Measured, not assumed. With ServerSideApply the comparison that decides sync
    # status is predictedLiveState against normalizedLiveState — not target
    # against live, which is what a manual `helm template | diff` shows and which
    # reported zero differences here while the Application sat OutOfSync:
    #
    #   target    vs normalizedLive   0 differences
    #   predicted vs normalizedLive   2 differences  <- the actual cause
    #
    # Verified on the cluster with root's selfHeal paused so the change survived
    # long enough to be evaluated: novashop-prometheus reached Synced.
    - group: apps
      kind: StatefulSet
      name: novashop-prometheus-alertmanager
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
  revisionHistoryLimit: 10

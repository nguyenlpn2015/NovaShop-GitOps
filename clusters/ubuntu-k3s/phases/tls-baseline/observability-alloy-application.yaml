apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novashop-alloy
  namespace: argocd
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: novashop
  annotations:
    # After Loki, the endpoint it writes to.
    argocd.argoproj.io/sync-wave: "-12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: novashop-platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.11.0
      helm:
        releaseName: novashop-alloy
        valueFiles:
          - $values/kubernetes/observability/alloy/helm-values.yaml
    - repoURL: https://github.com/nguyenlpn2015/NovaShop.git
      targetRevision: b9405fe14a0b2e619b791e15cfb3d668366d07eb
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10

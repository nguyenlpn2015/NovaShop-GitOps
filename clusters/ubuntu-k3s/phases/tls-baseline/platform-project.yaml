apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: novashop-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: novashop-platform
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: novashop
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster-scoped platform services for NovaShop Ubuntu k3s
  sourceRepos:
    - quay.io/jetstack/charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://github.com/nguyenlpn2015/NovaShop.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: novashop-development
    - server: https://kubernetes.default.svc
      namespace: novashop-staging
    - server: https://kubernetes.default.svc
      namespace: novashop-production
    - server: https://kubernetes.default.svc
      namespace: observability
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: apiregistration.k8s.io
      kind: APIService
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    # Loki runs as a single-binary StatefulSet. Omitting this is why
    # novashop-loki sat OutOfSync/Missing: Argo CD enforces this whitelist at
    # sync time, so the manifest rendered and validated cleanly and was refused
    # only after merge.
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: ""
      kind: PersistentVolumeClaim
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: CertificateRequest
    - group: cert-manager.io
      kind: Issuer
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

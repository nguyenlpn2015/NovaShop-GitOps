apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novashop-certificates
  namespace: argocd
  labels:
    app.kubernetes.io/name: novashop-certificates
    app.kubernetes.io/component: certificate-management
    app.kubernetes.io/part-of: novashop
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: novashop-platform
  source:
    repoURL: https://github.com/nguyenlpn2015/NovaShop.git
    targetRevision: 27893ba9e9744af9097fe499fca18c9a43b4dbdf
    path: kubernetes/cert-manager
    directory:
      recurse: false
      include: certificate.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10

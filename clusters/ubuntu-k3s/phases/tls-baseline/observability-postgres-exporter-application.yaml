apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novashop-postgres-exporter
  namespace: argocd
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: novashop
  annotations:
    # After Prometheus, which must exist to collect what this produces.
    argocd.argoproj.io/sync-wave: "-13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: novashop-platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-postgres-exporter
      targetRevision: 8.2.0
      helm:
        releaseName: novashop-postgres-exporter
        valueFiles:
          - $values/kubernetes/observability/postgres-exporter/helm-values.yaml
    - repoURL: https://github.com/nguyenlpn2015/NovaShop.git
      targetRevision: 633c2c41164dec89284b29706cf8c4d0f02de0cb
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10

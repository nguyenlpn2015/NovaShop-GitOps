apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../http
  - platform-project.yaml
  - cert-manager-application.yaml
  - certificates-application.yaml
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: novashop
    patch: |-
      - op: replace
        path: /spec/template/spec/sources/2/path
        value: kubernetes/ingress/examples

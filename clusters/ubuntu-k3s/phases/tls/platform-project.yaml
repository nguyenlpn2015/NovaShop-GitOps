apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: novashop-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: novashop-platform
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: novashop
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster-scoped platform services for NovaShop Ubuntu k3s
  sourceRepos:
    - quay.io/jetstack/charts
    - https://github.com/nguyenlpn2015/NovaShop.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: novashop-development
    - server: https://kubernetes.default.svc
      namespace: novashop-staging
    - server: https://kubernetes.default.svc
      namespace: novashop-production
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: apiregistration.k8s.io
      kind: APIService
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: CertificateRequest
    - group: cert-manager.io
      kind: Issuer
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: novashop
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "0"
      - op: replace
        path: /spec/template/spec/sources/0/helm/valueFiles
        value:
          - "$values/apps/novashop/values/{{ .valuesFile }}"
          - "$values/apps/novashop/targets/ubuntu-k3s/{{ .valuesFile }}"
      - op: add
        path: /spec/template/spec/sources/-
        value:
          repoURL: https://github.com/nguyenlpn2015/NovaShop.git
          targetRevision: 43eba6656d037ef84a369f2c8be3dfa8e4a48979
          path: kubernetes/ingress/http
          directory:
            recurse: false
            include: "{{ .valuesFile }}"

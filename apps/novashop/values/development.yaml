namespace:
  create: false
  name: novashop-development

config:
  environment: development
  nextPublicApiUrl: http://api.dev.novashop.local

secrets:
  existingSecret: novashop-development-secrets

backend:
  replicaCount: 1
  image:
    tag: "633c2c41164dec89284b29706cf8c4d0f02de0cb"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    tag: "633c2c41164dec89284b29706cf8c4d0f02de0cb"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  frontendHost: dev.novashop.local
  backendHost: api.dev.novashop.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  tls:
    enabled: false

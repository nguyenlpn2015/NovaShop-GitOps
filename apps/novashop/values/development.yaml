namespace:
  create: false
  name: novashop-development

config:
  environment: development

secrets:
  existingSecret: novashop-development-secrets

backend:
  replicaCount: 1
  image:
    tag: "1074ccc6a0f8c1cc8a99e4ba0d2624fe82aa2e66"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    tag: "1074ccc6a0f8c1cc8a99e4ba0d2624fe82aa2e66"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  frontendHost: dev.novashop.local
  backendHost: api.dev.novashop.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  tls:
    enabled: false

# Default-deny ingress, staged one environment at a time.
#
# These policies were written and trialled, then never deployed: the chart
# revision pinned here predated them by thirteen commits. This is the first
# environment to actually receive them, so it is the one that finds out whether
# the node-network rule admits kubelet probes on this cluster. If it does not,
# every replica goes NotReady and Traefik returns 503 -- which is why staging
# and production stay false until this environment has been observed.
networkPolicy:
  enabled: true

# Schema migration and demo data, run as an Argo CD PreSync hook.
#
# Enabled here first. A failed PreSync blocks the sync rather than breaking what
# is running, so the worst case in this environment is a stuck sync with the old
# replicas still serving -- which is exactly the failure worth having somewhere
# cheap before production.
migrations:
  enabled: true

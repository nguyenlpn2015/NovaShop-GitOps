namespace:
  create: false
  name: novashop-development

config:
  environment: development
  nextPublicApiUrl: http://api.dev.novashop.local

secrets:
  existingSecret: novashop-development-secrets

backend:
  replicaCount: 1
  image:
    tag: "87d958dea16201ed42cecb1c67895355836ff7d2"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    tag: "87d958dea16201ed42cecb1c67895355836ff7d2"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  frontendHost: dev.novashop.local
  backendHost: api.dev.novashop.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  tls:
    enabled: false

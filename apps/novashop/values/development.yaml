namespace:
  create: false
  name: novashop-development

config:
  environment: development
  nextPublicApiUrl: http://api.dev.novashop.local

secrets:
  existingSecret: novashop-development-secrets

backend:
  replicaCount: 1
  image:
    tag: "27893ba9e9744af9097fe499fca18c9a43b4dbdf"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    tag: "27893ba9e9744af9097fe499fca18c9a43b4dbdf"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  frontendHost: dev.novashop.local
  backendHost: api.dev.novashop.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  tls:
    enabled: false

# Default-deny ingress, staged one environment at a time.
#
# These policies were written and trialled, then never deployed: the chart
# revision pinned here predated them by thirteen commits. This is the first
# environment to actually receive them, so it is the one that finds out whether
# the node-network rule admits kubelet probes on this cluster. If it does not,
# every replica goes NotReady and Traefik returns 503 -- which is why staging
# and production stay false until this environment has been observed.
networkPolicy:
  enabled: true

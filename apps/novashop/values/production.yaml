namespace:
  create: false
  name: novashop-production

config:
  environment: production
  nextPublicApiUrl: https://api.novashop.example.com

secrets:
  existingSecret: novashop-production-secrets

backend:
  replicaCount: 3
  image:
    tag: "11e58345919ff9a273eb17cf3dbb104c3f223592"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicaCount: 3
  image:
    tag: "11e58345919ff9a273eb17cf3dbb104c3f223592"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  frontendHost: novashop.example.com
  backendHost: api.novashop.example.com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: novashop-production-tls

# Default-deny ingress.
#
# Enabled here after development ran with these policies and stayed healthy:
# four policies present, both replicas Ready, the site answering 200. That run
# is what established that nodeNetwork 10.10.1.0/24 admits kubelet probes on
# this cluster -- the rule that, if wrong, takes every replica NotReady and
# turns the edge into a wall of 503s.
networkPolicy:
  enabled: true

# Held until development has run the PreSync migration successfully. Flipping
# this is a one-line follow-up.
migrations:
  enabled: false

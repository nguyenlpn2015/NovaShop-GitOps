namespace:
  create: false
  name: novashop-production

config:
  environment: production
  nextPublicApiUrl: https://api.novashop.example.com

secrets:
  existingSecret: novashop-production-secrets

backend:
  replicaCount: 3
  image:
    tag: "344b8273e43dbc416d68df17a0ca8a22d0446ca1"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicaCount: 3
  image:
    tag: "344b8273e43dbc416d68df17a0ca8a22d0446ca1"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  frontendHost: novashop.example.com
  backendHost: api.novashop.example.com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: novashop-production-tls

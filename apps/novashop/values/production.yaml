namespace:
  create: false
  name: novashop-production

config:
  environment: production
  nextPublicApiUrl: https://api.novashop.example.com

secrets:
  existingSecret: novashop-production-secrets

backend:
  replicaCount: 3
  image:
    tag: "27893ba9e9744af9097fe499fca18c9a43b4dbdf"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicaCount: 3
  image:
    tag: "27893ba9e9744af9097fe499fca18c9a43b4dbdf"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  frontendHost: novashop.example.com
  backendHost: api.novashop.example.com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: novashop-production-tls

# Default-deny ingress, staged one environment at a time.
#
# Held at false until development has run with these policies. Flipping this is
# a one-line follow-up once that environment is observed healthy.
networkPolicy:
  enabled: false

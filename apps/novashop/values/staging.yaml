namespace:
  create: false
  name: novashop-staging

config:
  environment: staging
  nextPublicApiUrl: https://api.staging.novashop.example.com

secrets:
  existingSecret: novashop-staging-secrets

backend:
  replicaCount: 2
  image:
    tag: "11e58345919ff9a273eb17cf3dbb104c3f223592"

frontend:
  replicaCount: 2
  image:
    tag: "11e58345919ff9a273eb17cf3dbb104c3f223592"

ingress:
  frontendHost: staging.novashop.example.com
  backendHost: api.staging.novashop.example.com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: novashop-staging-tls

# Default-deny ingress.
#
# Enabled here after development ran with these policies and stayed healthy:
# four policies present, both replicas Ready, the site answering 200. That run
# is what established that nodeNetwork 10.10.1.0/24 admits kubelet probes on
# this cluster -- the rule that, if wrong, takes every replica NotReady and
# turns the edge into a wall of 503s.
networkPolicy:
  enabled: true

# Enabled after development ran the PreSync migration successfully: seven tables
# created, 128 products seeded, the Job Complete and the Application Synced.
#
# That run also found the reason to stage it. The provisioning step had revoked
# CREATE on schema public from PUBLIC to lock the metrics exporter out, and
# PUBLIC includes every role -- so it locked out the application role Alembic
# connects as. The Job failed with "permission denied for schema public", and
# the Application still reported Synced and Healthy with an empty database
# behind it. Fixed by granting CREATE back to the novashop role by name.
migrations:
  enabled: true

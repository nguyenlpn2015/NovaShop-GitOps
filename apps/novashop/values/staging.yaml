namespace:
  create: false
  name: novashop-staging

config:
  environment: staging
  nextPublicApiUrl: https://api.staging.novashop.example.com

secrets:
  existingSecret: novashop-staging-secrets

backend:
  replicaCount: 2
  image:
    tag: "27893ba9e9744af9097fe499fca18c9a43b4dbdf"

frontend:
  replicaCount: 2
  image:
    tag: "27893ba9e9744af9097fe499fca18c9a43b4dbdf"

ingress:
  frontendHost: staging.novashop.example.com
  backendHost: api.staging.novashop.example.com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: novashop-staging-tls

# Default-deny ingress.
#
# Enabled here after development ran with these policies and stayed healthy:
# four policies present, both replicas Ready, the site answering 200. That run
# is what established that nodeNetwork 10.10.1.0/24 admits kubelet probes on
# this cluster -- the rule that, if wrong, takes every replica NotReady and
# turns the edge into a wall of 503s.
networkPolicy:
  enabled: true

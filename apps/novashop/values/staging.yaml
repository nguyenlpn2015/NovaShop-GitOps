namespace:
  create: false
  name: novashop-staging

config:
  environment: staging
  nextPublicApiUrl: https://api.staging.novashop.example.com

secrets:
  existingSecret: novashop-staging-secrets

backend:
  replicaCount: 2
  image:
    tag: "27893ba9e9744af9097fe499fca18c9a43b4dbdf"

frontend:
  replicaCount: 2
  image:
    tag: "27893ba9e9744af9097fe499fca18c9a43b4dbdf"

ingress:
  frontendHost: staging.novashop.example.com
  backendHost: api.staging.novashop.example.com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: novashop-staging-tls

# Default-deny ingress, staged one environment at a time.
#
# Held at false until development has run with these policies. Flipping this is
# a one-line follow-up once that environment is observed healthy.
networkPolicy:
  enabled: false
